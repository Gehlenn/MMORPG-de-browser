<!DOCTYPE html>
<html>
<head>
    <title>Teste Login MMORPG</title>
</head>
<body>
    <h1>Teste de Login MMORPG</h1>
    <button onclick="createTestData()">Criar Dados de Teste</button>
    <button onclick="checkData()">Verificar Dados</button>
    <button onclick="openGame()">Abrir Jogo</button>
    
    <script>
        function createTestData() {
            // Criar conta de teste
            const accounts = {
                'teste': {
                    username: 'teste',
                    password: '123',
                    email: 'teste@eldoria.com',
                    id: '1'
                }
            };
            localStorage.setItem('eldoria_accounts', JSON.stringify(accounts));
            
            // Criar personagem de teste
            const characters = {
                'teste': [
                    {
                        id: 'char_test_1',
                        name: 'GuerreiroTest',
                        race: 'human',
                        class: 'warrior',
                        level: 1,
                        hp: 120,
                        maxHp: 120,
                        attack: 15,
                        defense: 10,
                        mana: 20,
                        maxMana: 20,
                        x: 400,
                        y: 300,
                        inventory: [],
                        equipment: {},
                        createdAt: new Date().toISOString()
                    }
                ]
            };
            localStorage.setItem('eldoria_characters', JSON.stringify(characters));
            
            alert('Dados de teste criados!\nLogin: teste\nSenha: 123\nPersonagem: GuerreiroTest');
        }
        
        function checkData() {
            const accounts = JSON.parse(localStorage.getItem('eldoria_accounts') || '{}');
            const characters = JSON.parse(localStorage.getItem('eldoria_characters') || '{}');
            
            console.log('Contas:', accounts);
            console.log('Personagens:', characters);
            
            alert('Dados verificados. Verifique o console.');
        }
        
        function openGame() {
            window.open('http://localhost:3000/index.html', '_blank');
        }
    </script>
</body>
</html>
