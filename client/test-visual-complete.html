<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual Completo - Legacy of Komodo</title>
    <link rel="stylesheet" href="css/hud-fix.css">
    <link rel="stylesheet" href="css/simple-sprites.css">
    <link rel="stylesheet" href="css/improved-hud.css">
    <link rel="stylesheet" href="css/wow-style-hud.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .test-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }
        
        .test-title {
            font-size: 18px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .test-section {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .test-button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .test-button:hover {
            background: #1976D2;
            transform: scale(1.05);
        }
        
        .test-button.active {
            background: #4CAF50;
        }
        
        .test-button.danger {
            background: #F44336;
        }
        
        .test-button.warning {
            background: #FFC107;
            color: #000;
        }
        
        .status {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px;
            border-radius: 4px;
            margin: 5px 0;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .status-line {
            margin: 2px 0;
            padding: 2px 4px;
            border-radius: 2px;
        }
        
        .status-success { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .status-error { background: rgba(244, 67, 54, 0.2); color: #F44336; }
        .status-warning { background: rgba(255, 193, 7, 0.2); color: #FFC107; }
        .status-info { background: rgba(33, 150, 243, 0.2); color: #2196F3; }
        
        .controls-info {
            font-size: 10px;
            color: #888;
            margin-top: 10px;
            line-height: 1.4;
        }
        
        .fps-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 10000;
        }
        
        .minimap-container {
            position: fixed;
            top: 10px;
            right: 100px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #2196F3;
            border-radius: 50%;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-title">🎮 Teste Visual Completo</div>
        
        <div class="test-section">
            <h4>🔧 Controles Principais</h4>
            <button class="test-button" onclick="startWorld()">Iniciar Mundo</button>
            <button class="test-button danger" onclick="stopWorld()">Parar Mundo</button>
            <button class="test-button warning" onclick="resetWorld()">Resetar</button>
        </div>
        
        <div class="test-section">
            <h4>🎨 HUDs</h4>
            <button class="test-button" onclick="switchHUD('normal')">Normal</button>
            <button class="test-button" onclick="switchHUD('improved')">Improved</button>
            <button class="test-button" onclick="switchHUD('wow')">WoW Style</button>
            <button class="test-button" onclick="toggleAllHUDs()">Toggle All</button>
        </div>
        
        <div class="test-section">
            <h4>👾 Entidades</h4>
            <button class="test-button" onclick="spawnMob('rat')">Rato</button>
            <button class="test-button" onclick="spawnMob('slime')">Slime</button>
            <button class="test-button" onclick="spawnMob('wolf')">Lobo</button>
            <button class="test-button" onclick="spawnMob('goblin')">Goblin</button>
            <button class="test-button" onclick="spawnMob('bear')">Urso</button>
            <button class="test-button" onclick="spawnNPC('merchant')">Mercador</button>
            <button class="test-button" onclick="spawnNPC('guard')">Guarda</button>
            <button class="test-button" onclick="clearEntities()">Limpar</button>
        </div>
        
        <div class="test-section">
            <h4>⚡ Ações</h4>
            <button class="test-button" onclick="damagePlayer(10)">Dano -10</button>
            <button class="test-button" onclick="healPlayer(20)">Cura +20</button>
            <button class="test-button" onclick="addExp(100)">+100 XP</button>
            <button class="test-button" onclick="addGold(50)">+50 Gold</button>
            <button class="test-button" onclick="levelUp()">Level Up</button>
            <button class="test-button" onclick="castSpell('magic_missile')">Magic Missile</button>
            <button class="test-button" onclick="castSpell('fire_bolt')">Fire Bolt</button>
        </div>
        
        <div class="test-section">
            <h4>🔍 Debug</h4>
            <button class="test-button" onclick="toggleDebug()">Debug Mode</button>
            <button class="test-button" onclick="showSystemInfo()">System Info</button>
            <button class="test-button" onclick="testPerformance()">Performance</button>
        </div>
        
        <div class="status" id="statusLog">
            <div class="status-line status-info">🚀 Sistema pronto para teste</div>
        </div>
        
        <div class="controls-info">
            <strong>Controles:</strong><br>
            WASD - Mover player<br>
            E - Interagir com NPCs<br>
            Espaço - Atacar mobs<br>
            F10 - Alternar HUDs<br>
            F5 - Toggle tracking<br>
            F6 - Debug mode<br>
            Click - Atacar/Interagir
        </div>
    </div>
    
    <div class="fps-counter" id="fpsCounter">FPS: 60</div>
    
    <div class="minimap-container" id="minimapContainer">
        <canvas id="testMinimap" width="150" height="150"></canvas>
    </div>

    <!-- Scripts -->
    <script src="IntegratedAssetManager.js"></script>
    <script src="ui/IntegratedHUD.js"></script>
    <script src="ui/ImprovedHUD.js"></script>
    <script src="ui/HUDIntegration.js"></script>
    <script src="ui/WoWStyleHUD.js"></script>
    <script src="ui/WoWHUDIntegration.js"></script>
    <script src="assets/SimpleSpriteSystem.js"></script>
    <script src="visual/EnhancedSpriteSystem.js"></script>
    <script src="world/SimpleMapRenderer.js"></script>
    <script src="visual/VisualIntegrationManager.js"></script>
    <script src="visual/VisualHUDIntegration.js"></script>

    <script>
        let worldActive = false;
        let currentHUD = 'wow';
        let debugMode = false;
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Status log
        function addStatus(message, type = 'info') {
            const statusLog = document.getElementById('statusLog');
            const line = document.createElement('div');
            line.className = `status-line status-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            statusLog.appendChild(line);
            statusLog.scrollTop = statusLog.scrollHeight;
            
            // Limitar linhas
            while (statusLog.children.length > 20) {
                statusLog.removeChild(statusLog.firstChild);
            }
        }
        
        // Inicializar sistemas
        function initializeSystems() {
            addStatus('🔧 Inicializando sistemas...', 'info');
            
            try {
                // Asset Manager
                window.assetManager = new window.IntegratedAssetManager();
                addStatus('✅ Asset Manager inicializado', 'success');
                
                // HUDs
                window.hudIntegration = new window.HUDIntegration();
                window.wowHUDIntegration = new window.WoWHUDIntegration();
                addStatus('✅ HUD Integration inicializada', 'success');
                
                // Enhanced Sprite System
                window.enhancedSpriteSystem = new window.EnhancedSpriteSystem(window.assetManager);
                addStatus('✅ Enhanced Sprite System inicializado', 'success');
                
                // Visual Manager
                window.visualManager = new window.VisualIntegrationManager();
                addStatus('✅ Visual Manager inicializado', 'success');
                
                // Visual HUD Integration
                window.visualHUDIntegration = new window.VisualHUDIntegration();
                addStatus('✅ Visual HUD Integration inicializada', 'success');
                
                // Ativar WoW HUD por padrão
                window.wowHUDIntegration.switchToWoWHUD();
                addStatus('🎮 WoW Style HUD ativada', 'success');
                
                // Iniciar FPS counter
                startFPSCounter();
                
                addStatus('🚀 Todos os sistemas prontos!', 'success');
                
            } catch (error) {
                addStatus(`❌ Erro na inicialização: ${error.message}`, 'error');
                console.error('Initialization error:', error);
            }
        }
        
        // Controles do mundo
        function startWorld() {
            if (worldActive) {
                addStatus('⚠️ Mundo já está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.activate();
                worldActive = true;
                addStatus('🌍 Mundo iniciado', 'success');
                
                // Criar player
                window.visualManager.playerSystem.createPlayer('TestPlayer', 'apprentice', 400, 300);
                addStatus('👤 Player criado', 'success');
                
                // Spawn mobs iniciais
                for (let i = 0; i < 10; i++) {
                    const types = ['rat', 'slime', 'wolf'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    const x = 300 + Math.random() * 200;
                    const y = 200 + Math.random() * 200;
                    window.visualManager.mobSystem.spawnMob(type, x, y);
                }
                addStatus('👾 10 mobs spawnados', 'success');
                
                // Spawn NPCs iniciais
                window.visualManager.npcSystem.spawnNPC('merchant', 200, 200);
                window.visualManager.npcSystem.spawnNPC('guard', 600, 200);
                window.visualManager.npcSystem.spawnNPC('healer', 400, 400);
                addStatus('🤖 3 NPCs spawnados', 'success');
                
            } catch (error) {
                addStatus(`❌ Erro ao iniciar mundo: ${error.message}`, 'error');
            }
        }
        
        function stopWorld() {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.deactivate();
                worldActive = false;
                addStatus('🛑 Mundo parado', 'warning');
            } catch (error) {
                addStatus(`❌ Erro ao parar mundo: ${error.message}`, 'error');
            }
        }
        
        function resetWorld() {
            stopWorld();
            setTimeout(() => {
                startWorld();
                addStatus('🔄 Mundo resetado', 'info');
            }, 500);
        }
        
        // Controles de HUD
        function switchHUD(type) {
            try {
                switch(type) {
                    case 'normal':
                        window.wowHUDIntegration.switchToNormalHUD();
                        break;
                    case 'improved':
                        window.wowHUDIntegration.switchToImprovedHUD();
                        break;
                    case 'wow':
                        window.wowHUDIntegration.switchToWoWHUD();
                        break;
                }
                currentHUD = type;
                addStatus(`🎨 HUD alterada para: ${type}`, 'info');
            } catch (error) {
                addStatus(`❌ Erro ao alterar HUD: ${error.message}`, 'error');
            }
        }
        
        function toggleAllHUDs() {
            try {
                window.wowHUDIntegration.toggleHUDMode();
                addStatus('🔄 HUDs alternadas', 'info');
            } catch (error) {
                addStatus(`❌ Erro ao alternar HUDs: ${error.message}`, 'error');
            }
        }
        
        // Controles de entidades
        function spawnMob(type) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                const player = window.visualManager.playerSystem.player;
                const x = player.x + (Math.random() - 0.5) * 100;
                const y = player.y + (Math.random() - 0.5) * 100;
                const mob = window.visualManager.mobSystem.spawnMob(type, x, y);
                addStatus(`👾 ${type} spawnado`, 'success');
            } catch (error) {
                addStatus(`❌ Erro ao spawnar mob: ${error.message}`, 'error');
            }
        }
        
        function spawnNPC(type) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                const player = window.visualManager.playerSystem.player;
                const x = player.x + (Math.random() - 0.5) * 100;
                const y = player.y + (Math.random() - 0.5) * 100;
                const npc = window.visualManager.npcSystem.spawnNPC(type, x, y);
                addStatus(`🤖 ${type} spawnado`, 'success');
            } catch (error) {
                addStatus(`❌ Erro ao spawnar NPC: ${error.message}`, 'error');
            }
        }
        
        function clearEntities() {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.mobSystem.mobs.clear();
                window.visualManager.npcSystem.npcs.clear();
                addStatus('🧹 Entidades limpas', 'info');
            } catch (error) {
                addStatus(`❌ Erro ao limpar entidades: ${error.message}`, 'error');
            }
        }
        
        // Ações do player
        function damagePlayer(amount) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.playerSystem.takeDamage(amount);
                addStatus(`💔 Player recebeu ${amount} de dano`, 'error');
            } catch (error) {
                addStatus(`❌ Erro ao aplicar dano: ${error.message}`, 'error');
            }
        }
        
        function healPlayer(amount) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.playerSystem.heal(amount);
                addStatus(`💚 Player curado em ${amount}`, 'success');
            } catch (error) {
                addStatus(`❌ Erro ao curar: ${error.message}`, 'error');
            }
        }
        
        function addExp(amount) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                const player = window.visualManager.playerSystem.player;
                player.exp += amount;
                
                // Check level up
                if (player.exp >= player.maxExp) {
                    window.visualManager.levelUpPlayer();
                }
                
                addStatus(`⭐ +${amount} XP adicionado`, 'success');
            } catch (error) {
                addStatus(`❌ Erro ao adicionar XP: ${error.message}`, 'error');
            }
        }
        
        function addGold(amount) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                const player = window.visualManager.playerSystem.player;
                player.gold += amount;
                addStatus(`💰 +${amount} Gold adicionado`, 'success');
            } catch (error) {
                addStatus(`❌ Erro ao adicionar Gold: ${error.message}`, 'error');
            }
        }
        
        function levelUp() {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.levelUpPlayer();
                addStatus('🎉 Level Up forçado', 'success');
            } catch (error) {
                addStatus(`❌ Erro no Level Up: ${error.message}`, 'error');
            }
        }
        
        function castSpell(spellType) {
            if (!worldActive) {
                addStatus('⚠️ Mundo não está ativo', 'warning');
                return;
            }
            
            try {
                window.visualManager.playerSystem.startSpellCast(spellType);
                addStatus(`✨ ${spellType} conjurado`, 'info');
            } catch (error) {
                addStatus(`❌ Erro ao conjurar magia: ${error.message}`, 'error');
            }
        }
        
        // Debug
        function toggleDebug() {
            debugMode = !debugMode;
            if (window.visualManager) {
                window.visualManager.toggleDebug();
            }
            addStatus(`🐛 Debug mode: ${debugMode ? 'ON' : 'OFF'}`, 'info');
        }
        
        function showSystemInfo() {
            try {
                const info = window.visualManager.getSystemInfo();
                addStatus(`📊 FPS: ${info.fps}`, 'info');
                addStatus(`👾 Mobs: ${info.entities.mobs}`, 'info');
                addStatus(`🤖 NPCs: ${info.entities.npcs}`, 'info');
                addStatus(`✨ Effects: ${info.entities.effects}`, 'info');
                addStatus(`🎯 Particles: ${info.entities.particles}`, 'info');
            } catch (error) {
                addStatus(`❌ Erro ao obter info: ${error.message}`, 'error');
            }
        }
        
        function testPerformance() {
            try {
                const start = performance.now();
                
                // Spawn 100 mobs
                for (let i = 0; i < 100; i++) {
                    const types = ['rat', 'slime'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    const x = Math.random() * 1600;
                    const y = Math.random() * 1200;
                    window.visualManager.mobSystem.spawnMob(type, x, y);
                }
                
                const end = performance.now();
                const time = end - start;
                
                addStatus(`⚡ Spawn 100 mobs em ${time.toFixed(2)}ms`, 'success');
                
                // Limpar após 2 segundos
                setTimeout(() => {
                    window.visualManager.mobSystem.mobs.clear();
                    addStatus('🧹 Mobs de teste limpos', 'info');
                }, 2000);
                
            } catch (error) {
                addStatus(`❌ Erro no teste de performance: ${error.message}`, 'error');
            }
        }
        
        // FPS Counter
        function startFPSCounter() {
            function updateFPS() {
                frameCount++;
                const currentTime = performance.now();
                
                if (currentTime >= lastTime + 1000) {
                    const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
                    
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
                requestAnimationFrame(updateFPS);
            }
            
            updateFPS();
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            // Controles já são processados pelo Visual Manager
            // Adicionar controles específicos do teste
            switch(e.key) {
                case 'F5':
                    e.preventDefault();
                    toggleDebug();
                    break;
            }
        });
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            addStatus('🚀 Página de teste carregada', 'info');
            
            setTimeout(() => {
                initializeSystems();
            }, 500);
        });
    </script>
</body>
</html>
