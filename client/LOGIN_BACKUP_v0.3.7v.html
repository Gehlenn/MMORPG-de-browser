<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria - MMORPG Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        #loginScreen {
            display: flex;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 350px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .form-row {
            margin-bottom: 20px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Estilo para select dropdown */
        .form-input option {
            background: #1a1a1a;
            color: white;
        }
        
        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }
        
        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .create-account {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        
        .create-account:hover {
            box-shadow: 0 10px 30px rgba(33, 150, 243, 0.4);
        }
        
        .message {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ffcdd2;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #c8e6c9;
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #bbdefb;
        }
        
        /* Character Selection Styles */
        .character-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 800px;
            max-width: 90vw;
        }
        
        .character-creation {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
            min-height: 150px;
        }
        
        .character-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);
        }
        
        .character-card.selected {
            border-color: #4CAF50;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(76, 175, 80, 0.1));
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        
        .character-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }
        
        .character-name {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .character-info {
            color: #aaa;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .character-level {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .character-class {
            color: #2196F3;
            font-weight: bold;
        }
        
        .character-race {
            color: #ff9800;
        }
        
        .character-stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8em;
        }
        
        .character-hp {
            color: #f44336;
        }
        
        .character-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .character-actions button {
            min-width: 150px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }
        
        .empty-state::before {
            content: '👤';
            display: block;
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        /* Game Screen Styles */
        #gameScreen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            background: #1a1a1a;
            border: 2px solid #333;
        }
        
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .hud {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            pointer-events: auto;
        }
        
        #player-info {
            top: 20px;
            left: 20px;
        }
        
        #stats-info {
            top: 20px;
            right: 20px;
        }
        
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4CAF50;
            border-radius: 5px;
        }
        
        .health-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen">
        <div class="login-container">
            <h1>⚔️ Eldoria</h1>
            <div style="text-align: center; margin-bottom: 20px; color: #aaa; font-size: 0.9em;">
                🏠 Versão Local de Desenvolvimento<br>
                Enhanced AI System v0.3.7v
            </div>
            <div id="loginMessage" class="message"></div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-row">
                    <input type="text" id="username" class="form-input" placeholder="Nome de Usuário" maxlength="20">
                </div>
                <div class="form-row">
                    <input type="password" id="password" class="form-input" placeholder="Senha" maxlength="30">
                </div>
                <div class="form-row">
                    <button id="loginBtn" class="login-button">Entrar no Jogo</button>
                    <button id="showCreateAccountBtn" class="login-button create-account">Criar Nova Conta</button>
                </div>
            </div>
            
            <!-- Create Account Form -->
            <div id="createAccountForm" style="display: none;">
                <h3 style="text-align: center; margin-bottom: 20px; color: #4CAF50;">Criar Nova Conta</h3>
                <div class="form-row">
                    <input type="text" id="newUsername" class="form-input" placeholder="Nome de Usuário" maxlength="20">
                </div>
                <div class="form-row">
                    <input type="email" id="newEmail" class="form-input" placeholder="E-mail" maxlength="50">
                </div>
                <div class="form-row">
                    <input type="password" id="newPassword" class="form-input" placeholder="Senha" maxlength="30">
                </div>
                <div class="form-row">
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirmar Senha" maxlength="30">
                </div>
                <div class="form-row">
                    <button id="createAccountBtn" class="login-button create-account">Criar Conta</button>
                    <button id="backToLoginBtn" class="login-button" style="background: #666;">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHARACTER SCREEN -->
    <div id="characterScreen" class="screen">
        <div class="character-container">
            <h2>⚔️ Seleção de Personagem</h2>
            <div id="characterMessage" class="message"></div>
            
            <!-- Lista de Personagens -->
            <div id="characterList" class="character-list"></div>
            
            <!-- Formulário de Criação -->
            <div id="characterCreation" class="character-creation" style="display: none;">
                <h3>🎭 Criar Novo Personagem</h3>
                <div class="form-row">
                    <input type="text" id="characterName" class="form-input" placeholder="Nome do Personagem" maxlength="20">
                </div>
                <div class="form-row">
                    <select id="characterRace" class="form-input">
                        <option value="">Selecione uma Raça</option>
                        <option value="human">Humano</option>
                        <option value="elf">Elfo</option>
                        <option value="dwarf">Anão</option>
                        <option value="orc">Orc</option>
                        <option value="undead">Morto-Vivo</option>
                    </select>
                </div>
                <div class="form-row">
                    <button id="createCharacterBtn" class="login-button create-account">Criar Aprendiz</button>
                    <button id="cancelCreationBtn" class="login-button" style="background: #666;">Cancelar</button>
                </div>
                <div style="text-align: center; margin-top: 15px; color: #888; font-size: 0.9em;">
                    💡 Todos personagens começam como Aprendiz e podem escolher sua classe no jogo
                </div>
            </div>
            
            <!-- Botões Principais -->
            <div class="character-actions">
                <button id="createNewCharacterBtn" class="login-button create-account">Criar Novo Personagem</button>
                <button id="enterWorldBtn" class="login-button" disabled style="display: none;">Entrar no Mundo</button>
                <button id="logoutBtn" class="login-button" style="background: #666;">Sair da Conta</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <div id="game-ui">
            <!-- Player Info HUD -->
            <div id="player-info" class="hud">
                <div id="playerName">Player</div>
                <div id="playerLevel">Lv. 1</div>
                <div class="health-bar">
                    <div id="healthFill" class="health-fill" style="width: 100%;"></div>
                </div>
                <div id="hpText">100/100 HP</div>
            </div>
            
            <!-- Stats Info HUD -->
            <div id="stats-info" class="hud">
                <div id="positionText">X: 400, Y: 300</div>
                <div id="mobCount">Mobs: 0</div>
                <div id="fpsText">FPS: 60</div>
            </div>
            
            <!-- Minimap -->
            <canvas id="minimap"></canvas>
        </div>
        
        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Scripts -->
    <script src="IntegratedAssetManager.js"></script>
    <script src="sprites/SpritesheetManager.js"></script>
    <script src="entities/NPCManager.js"></script>
    <script src="ui/IntegratedHUD.js"></script>
    <script src="world/IntegratedMap.js"></script>
    <script src="IntegratedGameplayEngine.js"></script>
    <script src="LocalDataManager.js"></script>
    <script src="SimpleLoginManager.js"></script>
    
    <script>
        // Inicializar sistema quando a página carregar
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Página carregada, inicializando sistemas integrados...');
            
            // Verificar se os scripts foram carregados
            const requiredScripts = [
                'IntegratedAssetManager',
                'SpritesheetManager', 
                'NPCManager',
                'IntegratedHUD',
                'IntegratedMap',
                'IntegratedGameplayEngine',
                'LocalDataManager',
                'SimpleLoginManager'
            ];
            
            const missingScripts = requiredScripts.filter(script => typeof window[script] === 'undefined');
            if (missingScripts.length > 0) {
                console.error('❌ Scripts faltando:', missingScripts);
                // Continuar mesmo com scripts faltando para não bloquear login
                console.warn('⚠️ Continuando sem scripts opcionais:', missingScripts);
            }
            
            console.log('✅ Todos os scripts carregados com sucesso');
            
            // Inicializar sistemas na ordem correta
            try {
                // 1. Asset Manager
                window.assetManager = new window.IntegratedAssetManager();
                console.log('✅ Asset Manager inicializado');
                
                // 2. Spritesheet Manager
                window.spritesheetManager = new window.SpritesheetManager();
                console.log('✅ Spritesheet Manager inicializado');
                
                // 3. NPC Manager
                window.npcManager = new window.NPCManager(window.spritesheetManager);
                console.log('✅ NPC Manager inicializado');
                
                // 4. Map System (com tratamento de erro)
                try {
                    window.mapSystem = new window.IntegratedMap(window.assetManager);
                    console.log('✅ Map System inicializado');
                } catch (error) {
                    console.error('❌ Erro ao inicializar Map System:', error);
                    window.mapSystem = null;
                }
                
                // 5. HUD System
                window.hudSystem = new window.IntegratedHUD(window.assetManager);
                console.log('✅ HUD System inicializado');
                
                // 6. Integrated Gameplay Engine (será inicializado quando player entrar no mundo)
                console.log('✅ Integrated Gameplay Engine pronto');
                
                // 7. Local Data Manager (sistema offline para desenvolvimento)
                window.dataManager = new window.LocalDataManager();
                console.log('✅ Local Data Manager inicializado');
                
                // 8. Login Manager (integrado com LocalDataManager)
                window.loginManager = new window.SimpleLoginManager();
                console.log('✅ Login Manager inicializado');
                
                // Forçar tela de login visível
                const loginScreen = document.getElementById('loginScreen');
                if (loginScreen) {
                    loginScreen.style.display = 'flex';
                    console.log('✅ Tela de login exibida');
                }
                
                // Mostrar notificação de sucesso
                if (window.hudSystem) {
                    window.hudSystem.showNotification('Sistemas integrados carregados com sucesso!', 'success');
                }
                
                console.log('🎮 Todos os sistemas inicializados e prontos!');
                
            } catch (error) {
                console.error('❌ Erro ao inicializar sistemas:', error);
            }
        });
    </script>
</body>
</html>
