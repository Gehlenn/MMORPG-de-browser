<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Painel de Subagentes - Eldoria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76,175,80,0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .agent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .agent-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .agent-icon {
            font-size: 2rem;
            margin-right: 15px;
        }

        .agent-title {
            flex: 1;
        }

        .agent-title h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .agent-title p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .agent-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-idle {
            background: rgba(255,193,7,0.2);
            color: #FFC107;
        }

        .status-running {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }

        .status-completed {
            background: rgba(33,150,243,0.2);
            color: #2196F3;
        }

        .status-error {
            background: rgba(244,67,54,0.2);
            color: #f44336;
        }

        .agent-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .metric {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4CAF50;
        }

        .metric-label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .results-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-content {
            max-height: 400px;
            overflow-y: auto;
        }

        .agent-result {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .issues-list, .suggestions-list {
            margin-top: 10px;
        }

        .issue-item, .suggestion-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 8px;
            border-left: 4px solid #f44336;
        }

        .suggestion-item {
            border-left-color: #2196F3;
        }

        .severity-high {
            border-left-color: #f44336;
        }

        .severity-medium {
            border-left-color: #FFC107;
        }

        .severity-low {
            border-left-color: #4CAF50;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Painel de Subagentes</h1>
            <p>Sistema especializado de análise e otimização para Eldoria MMORPG</p>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="btn btn-primary" onclick="runFullAnalysis()">
                    🚀 Executar Análise Completa
                </button>
                <button class="btn btn-secondary" onclick="runSpecificAgent()">
                    🎯 Executar Agente Específico
                </button>
                <button class="btn btn-secondary" onclick="showAgentList()">
                    📋 Listar Agentes
                </button>
                <button class="btn btn-danger" onclick="clearResults()">
                    🗑️ Limpar Resultados
                </button>
            </div>
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="summary-cards" id="summaryCards" style="display: none;">
            <div class="summary-card">
                <div class="summary-value" id="totalAgents">0</div>
                <div class="summary-label">Total de Agentes</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="successfulAgents">0</div>
                <div class="summary-label">Agentes Concluídos</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="issuesFound">0</div>
                <div class="summary-label">Problemas Encontrados</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="suggestionsCount">0</div>
                <div class="summary-label">Sugestões de Melhoria</div>
            </div>
        </div>

        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be populated here -->
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>📊 Resultados da Análise</h2>
                <button class="btn btn-secondary" onclick="exportResults()">
                    📥 Exportar Relatório
                </button>
            </div>
            <div class="results-content" id="resultsContent">
                <!-- Results will be populated here -->
            </div>
        </div>
    </div>

    <!-- Carregar sistema de subagentes -->
    <script src="subagents/EldoriaSubagentSystem.js"></script>
    
    <script>
        let subagentSystem;
        let currentAnalysis = null;

        // Inicializar sistema
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Inicializando painel de subagentes...');
            
            if (typeof EldoriaSubagentSystem !== 'undefined') {
                subagentSystem = new EldoriaSubagentSystem();
                populateAgentCards();
                console.log('✅ Sistema de subagentes carregado com sucesso!');
            } else {
                console.error('❌ Sistema de subagentes não encontrado');
                showError('Sistema de subagentes não encontrado. Verifique se o arquivo foi carregado.');
            }
        });

        function populateAgentCards() {
            const agentsGrid = document.getElementById('agentsGrid');
            const agents = subagentSystem.listAgents();
            
            agentsGrid.innerHTML = agents.map(agent => `
                <div class="agent-card" id="agent-${agent.name}">
                    <div class="agent-header">
                        <div class="agent-icon">${getAgentIcon(agent.name)}</div>
                        <div class="agent-title">
                            <h3>${agent.name.toUpperCase()}</h3>
                            <p>${agent.description}</p>
                        </div>
                    </div>
                    <div class="agent-status status-idle" id="status-${agent.name}">
                        AGUARDANDO
                    </div>
                    <div class="agent-metrics" id="metrics-${agent.name}">
                        <div class="metric">
                            <div class="metric-value">-</div>
                            <div class="metric-label">Score</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">-</div>
                            <div class="metric-label">Status</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getAgentIcon(agentName) {
            const icons = {
                gameplay: '🎮',
                ui: '🎨',
                network: '🌐',
                debug: '🔍',
                performance: '📊',
                assets: '🎨',
                documentation: '📝',
                testing: '🧪'
            };
            return icons[agentName] || '🤖';
        }

        async function runFullAnalysis() {
            if (!subagentSystem) {
                showError('Sistema de subagentes não inicializado');
                return;
            }

            console.log('🚀 Iniciando análise completa...');
            showProgress(true);
            
            try {
                // Atualizar status de todos os agentes
                const agents = subagentSystem.listAgents();
                agents.forEach(agent => {
                    updateAgentStatus(agent.name, 'running', 0);
                });

                // Executar análise
                const results = await subagentSystem.runFullAnalysis('e:\\app e jogos criados\\MMORPG de browser');
                currentAnalysis = results;

                // Atualizar interface
                updateSummaryCards(results);
                displayResults(results);
                showProgress(false);
                
                console.log('✅ Análise completa concluída!');
                showSuccess('Análise completa concluída com sucesso!');

            } catch (error) {
                console.error('❌ Erro na análise:', error);
                showError('Erro durante a análise: ' + error.message);
                showProgress(false);
            }
        }

        async function runSpecificAgent() {
            const agentName = prompt('Digite o nome do agente (gameplay, ui, network, debug, performance, assets, documentation, testing):');
            
            if (!agentName || !subagentSystem.agents.has(agentName)) {
                showError('Agente inválido. Agentes disponíveis: ' + Array.from(subagentSystem.agents.keys()).join(', '));
                return;
            }

            console.log(`🎯 Executando agente específico: ${agentName}`);
            updateAgentStatus(agentName, 'running', 0);

            try {
                const result = await subagentSystem.runAgent(agentName, 'e:\\app e jogos criados\\MMORPG de browser');
                
                updateAgentMetrics(agentName, result);
                updateAgentStatus(agentName, 'completed', 100);
                
                console.log(`✅ Agente ${agentName} concluído!`);
                showSuccess(`Agente ${agentName} concluído com sucesso!`);

            } catch (error) {
                console.error(`❌ Erro no agente ${agentName}:`, error);
                updateAgentStatus(agentName, 'error', 0);
                showError(`Erro no agente ${agentName}: ` + error.message);
            }
        }

        function showAgentList() {
            const agents = subagentSystem.listAgents();
            let message = '🤖 Agentes Disponíveis:\n\n';
            
            agents.forEach(agent => {
                message += `🔹 ${agent.name.toUpperCase()}\n`;
                message += `   ${agent.description}\n`;
                message += `   Capacidades: ${agent.capabilities.join(', ')}\n\n`;
            });
            
            alert(message);
        }

        function updateAgentStatus(agentName, status, progress) {
            const statusElement = document.getElementById(`status-${agentName}`);
            if (statusElement) {
                statusElement.className = `agent-status status-${status}`;
                statusElement.textContent = getStatusText(status);
            }

            // Atualizar progresso
            updateProgress(progress);
        }

        function updateAgentMetrics(agentName, result) {
            const metricsElement = document.getElementById(`metrics-${agentName}`);
            if (metricsElement && result.metrics) {
                const score = Object.values(result.metrics)[0] || 0;
                metricsElement.innerHTML = `
                    <div class="metric">
                        <div class="metric-value">${score}</div>
                        <div class="metric-label">Score</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value">${result.issues?.length || 0}</div>
                        <div class="metric-label">Issues</div>
                    </div>
                `;
            }
        }

        function getStatusText(status) {
            const texts = {
                idle: 'AGUARDANDO',
                running: 'EXECUTANDO...',
                completed: 'CONCLUÍDO',
                error: 'ERRO'
            };
            return texts[status] || 'DESCONHECIDO';
        }

        function updateProgress(percentage) {
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                progressFill.style.width = percentage + '%';
            }
        }

        function showProgress(show) {
            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                progressBar.style.display = show ? 'block' : 'none';
            }
        }

        function updateSummaryCards(results) {
            const summaryCards = document.getElementById('summaryCards');
            summaryCards.style.display = 'grid';
            
            document.getElementById('totalAgents').textContent = results.summary.totalAgents;
            document.getElementById('successfulAgents').textContent = results.summary.successfulAgents;
            
            let totalIssues = 0;
            let totalSuggestions = 0;
            
            Object.values(results.agents).forEach(result => {
                totalIssues += result.issues?.length || 0;
                totalSuggestions += result.suggestions?.length || 0;
            });
            
            document.getElementById('issuesFound').textContent = totalIssues;
            document.getElementById('suggestionsCount').textContent = totalSuggestions;
        }

        function displayResults(results) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsSection.style.display = 'block';
            
            let html = '';
            Object.entries(results.agents).forEach(([agentName, result]) => {
                html += `
                    <div class="agent-result">
                        <div class="result-header">
                            <h3>${getAgentIcon(agentName)} ${agentName.toUpperCase()}</h3>
                            <span class="agent-status status-${result.error ? 'error' : 'completed'}">
                                ${result.error ? 'ERRO' : 'CONCLUÍDO'}
                            </span>
                        </div>
                        
                        ${result.error ? `
                            <div class="issue-item severity-high">
                                <strong>Erro:</strong> ${result.error}
                            </div>
                        ` : ''}
                        
                        ${result.issues && result.issues.length > 0 ? `
                            <h4>🚨 Problemas Encontrados (${result.issues.length}):</h4>
                            <div class="issues-list">
                                ${result.issues.map(issue => `
                                    <div class="issue-item severity-${issue.severity}">
                                        <strong>${issue.type}:</strong> ${issue.description}<br>
                                        <em>Fix: ${issue.fix}</em>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        ${result.suggestions && result.suggestions.length > 0 ? `
                            <h4>💡 Sugestões de Melhoria (${result.suggestions.length}):</h4>
                            <div class="suggestions-list">
                                ${result.suggestions.map(suggestion => `
                                    <div class="suggestion-item">
                                        ${suggestion}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            resultsContent.innerHTML = html;
        }

        function clearResults() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('summaryCards').style.display = 'none';
            currentAnalysis = null;
            
            // Resetar status dos agentes
            const agents = subagentSystem.listAgents();
            agents.forEach(agent => {
                updateAgentStatus(agent.name, 'idle', 0);
                const metricsElement = document.getElementById(`metrics-${agent.name}`);
                if (metricsElement) {
                    metricsElement.innerHTML = `
                        <div class="metric">
                            <div class="metric-value">-</div>
                            <div class="metric-label">Score</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">-</div>
                            <div class="metric-label">Status</div>
                        </div>
                    `;
                }
            });
            
            console.log('🗑️ Resultados limpos');
        }

        function exportResults() {
            if (!currentAnalysis) {
                showError('Nenhum resultado para exportar');
                return;
            }

            const dataStr = JSON.stringify(currentAnalysis, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `eldoria-analysis-${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
            console.log('📥 Resultados exportados');
        }

        function showError(message) {
            alert('❌ Erro: ' + message);
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }
    </script>
</body>
</html>
