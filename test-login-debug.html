<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Login - Legacy of Komodo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .test-container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            z-index: 99999;
            position: relative;
        }
        
        .test-title {
            color: #2196F3;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #2196F3;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .test-button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .test-button:hover {
            background: #1976D2;
        }
        
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border: 1px solid #F44336;
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
            border: 1px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-title">🧪 Teste de Login</div>
        
        <div id="testMessage" class="message info">
            Testando funcionalidade básica de login...
        </div>
        
        <input type="text" id="testUsername" class="form-input" placeholder="Nome de Usuário" value="teste">
        <input type="password" id="testPassword" class="form-input" placeholder="Senha" value="123456">
        
        <button id="testLoginBtn" class="test-button">Testar Login</button>
        <button id="testCreateBtn" class="test-button">Criar Conta</button>
        <button id="testElementsBtn" class="test-button">Verificar Elementos</button>
        
        <div id="testResults" style="margin-top: 20px; font-family: monospace; font-size: 12px;"></div>
    </div>

    <script>
        // Teste básico de funcionalidade
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🧪 Página de teste de login carregada');
            
            const testUsername = document.getElementById('testUsername');
            const testPassword = document.getElementById('testPassword');
            const testLoginBtn = document.getElementById('testLoginBtn');
            const testCreateBtn = document.getElementById('testCreateBtn');
            const testElementsBtn = document.getElementById('testElementsBtn');
            const testMessage = document.getElementById('testMessage');
            const testResults = document.getElementById('testResults');
            
            function showMessage(message, type = 'info') {
                testMessage.textContent = message;
                testMessage.className = `message ${type}`;
            }
            
            function addResult(message) {
                const timestamp = new Date().toLocaleTimeString();
                testResults.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            }
            
            // Testar elementos
            testElementsBtn.addEventListener('click', () => {
                addResult('🔍 Verificando elementos...');
                
                const elements = [
                    'testUsername',
                    'testPassword', 
                    'testLoginBtn',
                    'testCreateBtn'
                ];
                
                elements.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        addResult(`✅ Elemento ${id}: OK (z-index: ${window.getComputedStyle(element).zIndex})`);
                    } else {
                        addResult(`❌ Elemento ${id}: NÃO ENCONTRADO`);
                    }
                });
                
                // Verificar se há canvas sobrepondo
                const canvases = document.querySelectorAll('canvas');
                if (canvases.length > 0) {
                    addResult(`⚠️ ${canvases.length} canvas(es) encontrados:`);
                    canvases.forEach((canvas, index) => {
                        const style = window.getComputedStyle(canvas);
                        addResult(`  Canvas ${index}: z-index=${style.zIndex}, display=${style.display}, pointer-events=${style.pointerEvents}`);
                    });
                } else {
                    addResult('✅ Nenhum canvas encontrado');
                }
            });
            
            // Testar login
            testLoginBtn.addEventListener('click', () => {
                const username = testUsername.value.trim();
                const password = testPassword.value;
                
                if (!username || !password) {
                    showMessage('Preencha todos os campos', 'error');
                    return;
                }
                
                addResult(`🔑 Tentando login com: ${username}`);
                showMessage('Processando login...', 'info');
                
                // Simular login bem-sucedido
                setTimeout(() => {
                    showMessage('Login simulado com sucesso!', 'success');
                    addResult('✅ Login simulado com sucesso');
                }, 1000);
            });
            
            // Testar criação de conta
            testCreateBtn.addEventListener('click', () => {
                const username = testUsername.value.trim();
                const password = testPassword.value;
                
                if (!username || !password) {
                    showMessage('Preencha todos os campos', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('Senha deve ter pelo menos 6 caracteres', 'error');
                    return;
                }
                
                addResult(`👤 Tentando criar conta: ${username}`);
                showMessage('Processando criação...', 'info');
                
                // Simular criação bem-sucedida
                setTimeout(() => {
                    showMessage('Conta criada com sucesso!', 'success');
                    addResult('✅ Conta criada com sucesso');
                }, 1000);
            });
            
            // Testar inputs
            testUsername.addEventListener('input', () => {
                addResult(`📝 Username alterado: ${testUsername.value}`);
            });
            
            testPassword.addEventListener('input', () => {
                addResult(`🔐 Password alterado: ${testPassword.value}`);
            });
            
            // Testar Enter key
            testUsername.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addResult('⏎ Enter pressionado no username');
                    testPassword.focus();
                }
            });
            
            testPassword.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addResult('⏎ Enter pressionado no password');
                    testLoginBtn.click();
                }
            });
            
            // Teste inicial
            addResult('🚀 Teste de login inicializado');
            showMessage('Teste pronto! Use os botões para testar.', 'info');
        });
    </script>
</body>
</html>
