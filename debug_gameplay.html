<!DOCTYPE html>
<html>
<head>
    <title>Debug Gameplay</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        canvas { border: 2px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Debug Gameplay Engine</h1>
    <button onclick="testGameplay()">Testar Gameplay</button>
    <button onclick="clearLogs()">Limpar Logs</button>
    
    <div id="logs"></div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <script src="GameplayEngine.js"></script>
    <script>
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            logs.appendChild(div);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function testGameplay() {
            log('Iniciando teste do GameplayEngine...', 'info');
            
            // Verificar se GameplayEngine foi carregado
            if (typeof GameplayEngine === 'undefined') {
                log('❌ GameplayEngine não encontrado!', 'error');
                return;
            }
            
            log('✅ GameplayEngine encontrado!', 'success');
            
            // Criar dados de teste
            const testData = {
                id: 'test_char_1',
                name: 'Test Warrior',
                class: 'warrior',
                race: 'human',
                level: 1,
                hp: 120,
                maxHp: 120,
                attack: 15,
                defense: 10,
                mana: 20,
                maxMana: 20,
                x: 400,
                y: 300,
                inventory: [],
                equipment: {}
            };
            
            log('Criando GameplayEngine com dados de teste...', 'info');
            
            try {
                const engine = new GameplayEngine('gameCanvas', testData);
                log('✅ GameplayEngine criado com sucesso!', 'success');
                
                // Verificar métodos
                if (typeof engine.start === 'function') {
                    log('✅ Método start() encontrado', 'success');
                } else {
                    log('❌ Método start() não encontrado', 'error');
                }
                
                if (typeof engine.update === 'function') {
                    log('✅ Método update() encontrado', 'success');
                } else {
                    log('❌ Método update() não encontrado', 'error');
                }
                
                if (typeof engine.render === 'function') {
                    log('✅ Método render() encontrado', 'success');
                } else {
                    log('❌ Método render() não encontrado', 'error');
                }
                
                // Tentar iniciar
                log('Tentando iniciar o jogo...', 'info');
                engine.start();
                log('✅ Jogo iniciado com sucesso!', 'success');
                
            } catch (error) {
                log(`❌ Erro ao criar GameplayEngine: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Verificar carregamento automático
        window.addEventListener('load', () => {
            log('Página carregada, verificando scripts...', 'info');
            
            setTimeout(() => {
                if (typeof GameplayEngine !== 'undefined') {
                    log('✅ GameplayEngine disponível globalmente', 'success');
                } else {
                    log('❌ GameplayEngine não disponível globalmente', 'error');
                }
            }, 1000);
        });
    </script>
</body>
</html>
