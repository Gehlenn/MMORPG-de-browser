# Docker Compose - Stack Gratuito para MMORPG
# Version 1.0.0 - Zero Budget Infrastructure
version: '3.8'

services:
  # Frontend (Nginx + React)
  frontend:
    image: nginx:alpine
    container_name: eldoria-frontend
    ports:
      - "3000:80"
    volumes:
      - ./client:/usr/share/nginx/html
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - eldoria-network

  # Backend (Node.js)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.free
    container_name: eldoria-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/eldoria
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-here
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - eldoria-network

  # Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: eldoria-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=eldoria
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - eldoria-network

  # Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: eldoria-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - eldoria-network

  # Monitoring (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: eldoria-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - eldoria-network

  grafana:
    image: grafana/grafana:latest
    container_name: eldoria-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - eldoria-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  eldoria-network:
    driver: bridge
