version: '3.8'

services:
  # Production Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${FRONTEND_URL}
      - LOG_LEVEL=info
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mmorpg-network

  # Production Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.production
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=${BACKEND_URL}
      - REACT_APP_WS_URL=${BACKEND_URL}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mmorpg-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mmorpg-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - mmorpg-network

volumes:
  redis_data:

networks:
  mmorpg-network:
    driver: bridge
